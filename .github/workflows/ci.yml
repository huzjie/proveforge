name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m compileall -q proveforge
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Doctor smoke
        run: PYTHONPATH=. python -m proveforge.cli doctor
      - name: Bench smoke
        run: PYTHONPATH=. python -m proveforge.cli bench
