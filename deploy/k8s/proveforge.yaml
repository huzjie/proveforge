apiVersion: apps/v1
kind: Deployment
metadata:
  name: proveforge
  labels:
    app: proveforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proveforge
  template:
    metadata:
      labels:
        app: proveforge
    spec:
      containers:
        - name: proveforge
          image: proveforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8431
          readinessProbe:
            httpGet:
              path: /health
              port: 8431
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proveforge
spec:
  selector:
    app: proveforge
  ports:
    - port: 8431
      targetPort: 8431
  type: ClusterIP
